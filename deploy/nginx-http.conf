# uzbridge — plain HTTP: ACME challenges for per-company certificates, then HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name app.__DOMAIN__ api.__DOMAIN__ *.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/uzbridge-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
