# uzbridge — HTTPS. One certificate (cert-name "uzbridge") lists app, api and
# every company subdomain; deploy/sync-certs.sh expands it after each signup.
upstream uzbridge_app {
    server 127.0.0.1:8110;
}

server {
    # nginx 1.24 on the server: http2 goes on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ app.__DOMAIN__ api.__DOMAIN__ *.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/uzbridge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzbridge/privkey.pem;

    access_log /var/log/nginx/uzbridge_access.log;
    error_log  /var/log/nginx/uzbridge_error.log;
    client_max_body_size 5m;

    root /opt/uzbridge/frontend;

    # Django: API, provider callbacks, pay pages, amoCRM OAuth, admin.
    location ~ ^/(api|cb|p|oauth|admin)(/|$) {
        proxy_pass http://uzbridge_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite, don't append: the Payme IP allowlist reads this.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /opt/uzbridge/backend/staticfiles/;
        expires 7d;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The dashboard SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
